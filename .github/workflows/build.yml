name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -f signing/release.jks ]; then
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          # Private repo: the app's own signing key lives in signing/ so updates install over the previous version.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'rfeJ95iVjpZOkkxabfWaPe8S' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'hmz' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'rfeJ95iVjpZOkkxabfWaPe8S' }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            ERR=$(grep -E "^e: |What went wrong|^> |error:|Could not|Unresolved|AAPT" build.log | grep -v "^> Task" | head -70 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build::$ERR"
            exit 1
          fi

      - run: cp app/build/outputs/apk/release/app-release.apk HMZ-Play.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HMZ-Play
          path: HMZ-Play.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HMZ Play 1.0.${{ github.run_number }}
          files: HMZ-Play.apk
          make_latest: true
